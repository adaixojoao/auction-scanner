{% extends "base.html" %}
{% block content %}
<div class="page-head">
  <div>
    <h1>Listings</h1>
    <p>Everything the scanner found, scored. ☆ puts a listing on your Offers list; ✕ dismisses it for good.</p>
  </div>
  <div class="menu">
    <button class="btn" data-menu>Export report ▾</button>
    <div class="menu-list">
      <a href="/export/report.docx">Word (.docx)</a>
      <a href="/export/report.pdf">PDF</a>
      <a href="/export/report.md">Markdown</a>
    </div>
  </div>
</div>

<div class="stats" id="stats"></div>

<div class="card filters">
  <div class="field"><label>Country</label>
    <select id="f-country"><option value="">All</option>
      {% for code, name in countries %}<option value="{{ code }}">{{ name }}</option>{% endfor %}
    </select></div>
  <div class="field"><label>What</label>
    <select id="f-kind">
      <option value="">Everything</option>
      <option value="home">Homes</option>
      <option value="urban_plot">Urban plots</option>
      <option value="rural_plot">Rural plots</option>
      <option value="other">Other (shops, garages…)</option>
    </select></div>
  <div class="field"><label>Source</label><select id="f-source"><option value="">All</option></select></div>
  <div class="field"><label>Show</label>
    <select id="f-status">
      <option value="">Open listings</option>
      <option value="shortlisted">Shortlisted</option>
      <option value="hidden">Hidden (why?)</option>
    </select></div>
  <div class="field"><label>Max price</label><input type="number" id="f-maxprice" value="{{ max_price }}" step="5000"></div>
  <div class="field"><label>Min score</label><input type="number" id="f-minscore" value="0" step="5" min="0" max="100"></div>
  <div class="field wide"><label>Search</label><input type="text" id="f-search" placeholder="title, place, description…"></div>
  <label class="check"><input type="checkbox" id="f-properties" checked> Property only</label>
  <button class="btn btn-primary" onclick="page=1; load()">Apply</button>
</div>

<table class="list">
  <thead><tr>
    <th class="sortable" data-sort="score">Score</th>
    <th class="sortable" data-sort="country"></th>
    <th class="sortable" data-sort="title">Title</th>
    <th class="sortable" data-sort="price">Price</th>
    <th class="sortable" data-sort="current_bid">Bid</th>
    <th>Location</th>
    <th class="sortable" data-sort="date_end">Ends</th>
    <th>Why</th>
    <th></th>
  </tr></thead>
  <tbody id="rows"></tbody>
</table>
<div class="pagination" id="pagination"></div>
{% endblock %}

{% block scripts %}
<script>
let sort = "score", dir = "desc", page = 1;
const KIND_LABEL = {home: "home", urban_plot: "urban plot", rural_plot: "rural plot", other: "other"};
const PER_PAGE = 50;
const $ = id => document.getElementById(id);

async function load() {
  const status = $("f-status").value;
  const params = new URLSearchParams({
    country: $("f-country").value, source: $("f-source").value, kind: $("f-kind").value,
    max_price: $("f-maxprice").value, min_score: $("f-minscore").value,
    search: $("f-search").value, properties: $("f-properties").checked ? 1 : 0,
    show_hidden: status === "hidden" ? 1 : 0, status: status === "shortlisted" ? "shortlisted" : "",
    sort, dir, page, per_page: PER_PAGE,
  });
  const data = await (await fetch("/api/listings?" + params)).json();
  lastFound = data.found ?? data.total; lastCap = data.cap ?? 100;
  renderStats(data.stats);
  renderRows(data.items, status === "hidden");
  renderPages(data.total);
}

function renderStats(s) {
  const hidden = Object.entries(s.hidden || {}).map(([k, v]) => `${v} ${k}`).join(", ");
  $("stats").innerHTML = `
    <div class="stat"><div class="label">${lastFound > lastCap ? "Showing the best" : "Matching"}</div><div class="value" title="${AS.esc(countText())}">${s.total}${lastFound > lastCap ? `<span class="small muted"> of ${lastFound}</span>` : ""}</div></div>
    <div class="stat"><div class="label">New (24 h)</div><div class="value ok">${s.new_today}</div></div>
    <div class="stat"><div class="label">Score 70+</div><div class="value warn">${s.high_score}</div></div>
    <div class="stat"><div class="label">Homes · urban · rural plots</div><div class="value">${s.homes} · ${s.urban_plots} · ${s.rural_plots}</div></div>
    <div class="stat"><div class="label">Shortlisted</div><div class="value">${s.shortlisted}</div></div>
    <div class="stat"><div class="label">Sources failing</div><div class="value ${s.sources_failing ? "bad" : "ok"}"><a href="/sources" style="color:inherit">${s.sources_failing}</a></div></div>
    ${hidden ? `<div class="stat"><div class="label">Hidden</div><div class="small muted" style="margin-top:6px">${AS.esc(hidden)}</div></div>` : ""}`;
}

function renderRows(items, hiddenView) {
  if (!items.length) {
    $("rows").innerHTML = `<tr><td colspan="9"><div class="empty">
      <h3>No listings here</h3>
      <p>${hiddenView ? "Nothing is hidden with these filters." : "Change the filters, or run a scan."}</p>
      ${hiddenView ? "" : `<p style="margin-top:14px"><button class="btn btn-primary" onclick="AS.startScan({countries:['PT']})">Scan Portugal now</button></p>`}
    </div></td></tr>`;
    return;
  }
  $("rows").innerHTML = items.map(it => {
    const loc = [it.concelho, it.district].filter(Boolean).join(", ");
    const badges = (it.kind ? `<span class="badge b-muted">${AS.esc(KIND_LABEL[it.kind])}</span>` : "")
      + (it.is_recent ? '<span class="badge b-new">NEW</span>' : "")
      + (it.price_drop_pct ? `<span class="badge b-drop">↓${Math.round(it.price_drop_pct)}%</span>` : "")
      + (it.offer_outcome ? `<span class="badge b-offer">offer ${AS.esc(it.offer_outcome)}</span>` : "")
      + (it.hidden_reason ? `<span class="badge b-hidden" title="${AS.esc(it.hidden_reason)}">${AS.esc(it.hidden_category)}</span>` : "");
    const starred = it.status === "shortlisted";
    // IDs go through data-id, never into the onclick source.
    const id = AS.esc(it.id);
    const actions = it.status === "dismissed"
      ? `<button class="btn btn-sm" data-id="${id}" onclick="setStatus(this.dataset.id, null)">Restore</button>`
      : `<button class="icon-btn ${starred ? "on" : ""}" title="${starred ? "Remove from Offers" : "Shortlist for an offer"}" data-id="${id}" onclick="setStatus(this.dataset.id, ${starred ? "null" : "'shortlisted'"})">${starred ? "★" : "☆"}</button>
         <button class="icon-btn" title="Dismiss" data-id="${id}" onclick="setStatus(this.dataset.id, 'dismissed')">✕</button>`;
    // Citius has no page per sale: its title opens the details, with the way to find it.
    const titleLink = it.source === "citius"
      ? `<a href="#" data-id="${id}" onclick="toggleDetails(this); return false">${AS.esc(it.title || "?")}</a>`
      : AS.link(it.url, it.title || "?");
    return `<tr class="${it.hidden_reason ? "dim" : ""}">
      <td>${AS.scoreBadge(it.score, it.rank)}</td>
      <td>${AS.flag(it.country)}</td>
      <td class="t-title">${titleLink}${badges}<div class="small faint"><span class="src">${AS.esc(it.source)}</span></div></td>
      <td class="nowrap"><b>${AS.money(it.price)}</b></td>
      <td class="nowrap muted">${it.current_bid ? AS.money(it.current_bid) : "–"}</td>
      <td class="small muted">${AS.esc(loc)}</td>
      <td class="nowrap small">${AS.esc(it.date_end ? it.date_end.slice(0, 10) : "–")}</td>
      <td class="t-why">${AS.esc((it.reasons || []).join(", "))}</td>
      <td class="nowrap"><button class="icon-btn" title="Details" data-id="${id}" onclick="toggleDetails(this)">ⓘ</button>${actions}</td>
    </tr>`;
  }).join("");
}

// ── Details panel: everything known about one listing (listing_info.py) ──
async function toggleDetails(el) {
  const row = el.closest("tr"), next = row.nextElementSibling;
  if (next && next.classList.contains("details-row")) { next.remove(); return; }
  const d = await AS.api("/api/listing?id=" + encodeURIComponent(el.dataset.id));
  const tr = document.createElement("tr");
  tr.className = "details-row";
  tr.innerHTML = `<td colspan="9">${detailsHtml(d)}</td>`;
  row.after(tr);
}

function factValue(f) {
  const v = AS.esc(f.value);
  if (/e-mail/i.test(f.label) && /^[^\s@]+@[^\s@]+$/.test(f.value)) return `<a href="mailto:${v}">${v}</a>`;
  if (/phone/i.test(f.label)) return `<a href="tel:${AS.esc(f.value.replace(/[^0-9+]/g, ""))}">${v}</a>`;
  return v;
}

function detailsHtml(d) {
  const facts = d.facts.map(f => `<div class="fact"><span class="k">${AS.esc(f.label)}</span><span class="v">${factValue(f)}</span></div>`).join("");
  const links = [d.url && d.source !== "citius" ? AS.link(d.url, "Open the listing ↗") : "",
                 ...d.related.map(r => AS.link(r.url, r.label + " ↗"))].filter(Boolean).join(" · ");
  const guide = d.how_to_find ? `<div class="guide">
      <b>How to find this sale on ${AS.esc(d.how_to_find.site)}</b> <span class="small muted">${AS.esc(d.how_to_find.why)}</span>
      <ol>${d.how_to_find.steps.map(s => `<li>${AS.esc(s.text)}
        ${s.copy ? ` <code>${AS.esc(s.copy)}</code> <button class="btn btn-sm" data-copy="${AS.esc(s.copy)}" onclick="copyText(this.dataset.copy)">Copy</button>` : ""}
        ${s.url ? ` ${AS.link(s.url, "Open Citius ↗")}` : ""}</li>`).join("")}</ol></div>` : "";
  const sv = d.street_view;
  const streetView = sv ? `<div class="guide street">
      <b>Where it is</b> <span class="small muted">(${AS.esc(sv.precision)})</span>
      ${sv.embed ? `<iframe class="sv-frame" src="${AS.esc(sv.embed)}" loading="lazy" allowfullscreen referrerpolicy="no-referrer-when-downgrade"></iframe>` : ""}
      <p class="d-links">${AS.link(sv.url, "Street View ↗")} · ${AS.link(sv.satellite, "Satellite ↗")}
      ${sv.embed ? "" : `<span class="small faint"> · Add a Google Maps key in Settings to see Street View here.</span>`}</p>
    </div>` : "";
  const off = d.official;
  const official = off ? `<div class="guide official">
      <b>Official records: ${AS.esc(off.registry)}</b>
      ${off.check ? `<p class="small"><b>${AS.esc(off.check)}</b></p>` : ""}
      ${off.facts.length ? `<div class="facts">${off.facts.map(f => `<div class="fact"><span class="k">${AS.esc(f.label)}</span><span class="v">${AS.esc(f.value)}</span></div>`).join("")}</div>` : ""}
      ${off.copy.length ? `<ul class="copy-list">${off.copy.map(c => `<li>${AS.esc(c.label)}: <code>${AS.esc(c.value)}</code> <button class="btn btn-sm" data-copy="${AS.esc(c.value)}" onclick="copyText(this.dataset.copy)">Copy</button></li>`).join("")}</ul>` : ""}
      ${off.steps.length ? `<ol>${off.steps.map(s => `<li>${AS.esc(s.text)}</li>`).join("")}</ol>` : ""}
      ${off.links.map(l => AS.link(l.url, l.label + " ↗")).join(" · ")}
    </div>` : "";
  return `<div class="details">
    ${d.image ? `<img class="d-img" src="${AS.esc(d.image)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : ""}
    <div class="d-main">
      ${guide}
      ${streetView}
      ${official}
      ${links ? `<p class="d-links">${links}</p>` : ""}
      ${facts ? `<div class="facts">${facts}</div>` : ""}
      ${(d.same_case || []).length ? `<div class="d-lots"><b>Also sold in this case</b> <span class="small muted">(buying together can make sense: a house and the plot next to it)</span><ul>${
        d.same_case.map(l => `<li>${AS.money(l.price)}${l.area ? ` · ${Math.round(l.area).toLocaleString("de-DE")} m²` : ""} — ${AS.esc(l.title)}</li>`).join("")}</ul></div>` : ""}
      ${d.description ? `<p class="d-desc">${AS.esc(d.description)}</p>` : ""}
      <p class="small muted">Why this score: ${AS.esc(d.reasons.join(", "))}</p>
    </div></div>`;
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); AS.toast("Copied: " + text); }
  catch { AS.toast("Select the text and copy it", "warn"); }
}

function renderPages(total) {
  const pages = Math.ceil(total / PER_PAGE), el = $("pagination");
  if (pages <= 1) { el.innerHTML = ""; return; }
  const first = Math.max(1, Math.min(page - 4, pages - 9)), last = Math.min(pages, first + 9);
  let html = `<button class="btn btn-sm" ${page === 1 ? "disabled" : ""} onclick="go(${page - 1})">‹</button>`;
  for (let i = first; i <= last; i++) html += `<button class="btn btn-sm ${i === page ? "active" : ""}" onclick="go(${i})">${i}</button>`;
  el.innerHTML = html + `<button class="btn btn-sm" ${page === pages ? "disabled" : ""} onclick="go(${page + 1})">›</button><span class="small muted" style="align-self:center">${countText()}</span>`;
}
let lastFound = 0, lastCap = 100;
function countText() {
  return lastFound > lastCap ? `best ${lastCap} of ${lastFound.toLocaleString("de-DE")} listings`
                             : `${lastFound} listings`;
}
function go(p) { page = p; load(); window.scrollTo(0, 0); }

async function setStatus(id, status) {
  await AS.api("/api/listings/status", {method: "POST", body: {id, status}});
  AS.toast(status === "shortlisted" ? "Added to Offers" : status === "dismissed" ? "Dismissed" : "Restored");
  load();
}

document.querySelectorAll("th.sortable").forEach(th => th.addEventListener("click", () => {
  const col = th.dataset.sort;
  if (sort === col) dir = dir === "desc" ? "asc" : "desc";
  else { sort = col; dir = col === "date_end" || col === "price" ? "asc" : "desc"; }
  load();
}));
$("f-search").addEventListener("keydown", e => { if (e.key === "Enter") { page = 1; load(); } });
["f-country", "f-kind", "f-source", "f-status", "f-properties"].forEach(id => $(id).addEventListener("change", () => { page = 1; load(); }));
document.addEventListener("scan-finished", load);

fetch("/api/meta").then(r => r.json()).then(d => d.sources.forEach(s => {
  const o = document.createElement("option"); o.value = s; o.textContent = s; $("f-source").appendChild(o);
}));
load();
</script>
{% endblock %}

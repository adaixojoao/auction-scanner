name: tests

on:
  # PRs are tested by pull_request; push only covers master after a merge.
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    # The app runs on a Windows desktop with Python 3.13 and updates itself from
    # master, so the suite runs there too; 3.11 is the oldest supported version.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint (unused imports, undefined names)
        if: runner.os == 'Linux' && matrix.python == '3.13'
        run: python -m pyflakes *.py sources/ tests/ scripts/
      - name: Tests (offline — the suite refuses network access)
        run: python -m pytest -q

  browser:
    # The Listings page in headless Chromium (tests/test_browser_*.py):
    # late and aborted reads, note saves, refreshes, history, keyboard, and the
    # results table (columns, sorting, thumbnails, density, research section). Every
    # request is answered in-process by the Flask app on a temporary database;
    # no auction or registry site is contacted. Playwright is dev-only
    # (requirements-browser.txt); the jobs above skip these tests.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt -r requirements-browser.txt
      - name: Install Chromium for Playwright (a download from Playwright's CDN)
        run: python -m playwright install --with-deps chromium
      - name: Browser tests
        env:
          REQUIRE_BROWSER: "1"
        run: python -m pytest -q tests/test_browser_listings.py tests/test_browser_results.py tests/test_browser_drafts.py
